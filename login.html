<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                <div class="logo-container">
                    <!-- Circular Logo Image -->
                    <img src="assets/images/logo.jpg" alt="Dakshin Logo" class="logo-img"
                        onerror="this.src='assets/images/logo.png'">
                    <div>
                        <div class="logo-text">Dakshin</div>
                        <div class="logo-subtitle">SOUTH INDIA • ENDLESS DISCOVERIES</div>
                    </div>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon bg-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="tourpackages.html">Tour Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="openTripPlanner()">Trip Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="faqs.html">FAQs</a></li>
                    <li class="nav-item" id="authNavItem">
                        <a class="nav-link" id="authLink" href="login.html">Sign In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-card">
        <div class="logo">✨ Dakshin</div>
        <h3 class="text-center mb-2">Welcome Back!</h3>
        <p class="text-center text-muted mb-4">Login to continue your travel journey</p>

        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <form id="loginForm">
            <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Email Address" required>
            </div>
            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
        </form>
        <div class="text-center mt-4 pt-3 border-top">
            <p class="small">Don't have an account? <a href="signup.html"
                    class="text-danger text-decoration-none fw-bold">Create Account</a></p>
        </div>
    </div>

    <footer>
        <p>© 2026 Dakshin | South India's Ultimate Travel Guide</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);
            const errorDiv = document.getElementById('errorMessage');

            if (user) {
                const { password, ...safeUser } = user;
                localStorage.setItem('dakshin_current_user', JSON.stringify(safeUser));
                const redirect = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
                sessionStorage.removeItem('redirectAfterLogin');
                window.location.href = redirect;
            } else {
                errorDiv.textContent = 'Invalid email or password';
                errorDiv.classList.remove('d-none');
                setTimeout(() => errorDiv.classList.add('d-none'), 3000);
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (redirectUrl) sessionStorage.setItem('redirectAfterLogin', redirectUrl);
    </script>
</body>

</html>
