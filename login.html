<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-login {
            background: linear-gradient(135deg, #d41e3c, #ff6b35);
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            color: white;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group-custom input:focus {
            outline: none;
            border-color: #d41e3c;
            box-shadow: 0 0 0 3px rgba(212, 30, 60, 0.1);
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px;">
    <div class="login-card">
        <div class="logo">✨ Dakshin</div>
        <h3 class="text-center mb-2">Welcome Back!</h3>
        <p class="text-center text-muted mb-4">Log in to continue your travel journey</p>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input type="text" id="loginEmail" placeholder="Email or Username" required>
            </div>
            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <label class="d-flex align-items-center gap-2"><input type="checkbox" id="rememberMe"> <span
                        class="small">Remember Me</span></label>
                <a href="#" class="text-danger small text-decoration-none" onclick="forgotPassword(event)">Forgot
                    Password?</a>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Log In</button>
        </form>
        <div class="text-center mt-4 pt-3 border-top">
            <p class="small">Don't have an account? <a href="signup.html"
                    class="text-danger text-decoration-none fw-bold">Create Account</a></p>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script>
        function forgotPassword(e) { e.preventDefault(); alert("📧 Password reset link will be sent to your registered email address."); }
        const urlParams = new URLSearchParams(window.location.search); const redirectUrl = urlParams.get('redirect'); if (redirectUrl) sessionStorage.setItem('redirectAfterLogin', redirectUrl);
    </script>
</body>

</html>
