<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-login {
            background: linear-gradient(135deg, #d41e3c, #ff6b35);
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            color: white;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group-custom input:focus {
            outline: none;
            border-color: #d41e3c;
            box-shadow: 0 0 0 3px rgba(212, 30, 60, 0.1);
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .otp-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .otp-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 5px;
        }

        .btn-otp {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 0 20px;
            font-weight: 600;
            color: #d41e3c;
            white-space: nowrap;
        }

        .btn-otp:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .resend-text {
            text-align: center;
            margin-top: 15px;
        }

        .resend-text a {
            color: #d41e3c;
            cursor: pointer;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
                margin: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px;">
        <div class="login-card">
            <div class="logo">✨ Dakshin</div>
            <h3 class="text-center mb-2">Welcome Back!</h3>
            <p class="text-center text-muted mb-4">Secure login with OTP verification</p>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Step 1: Email Input -->
            <div id="step1" class="step active">
                <form id="loginForm" onsubmit="sendOTP(event)">
                    <div class="input-group-custom">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <button type="submit" class="btn-login" id="sendOtpBtn">
                        <i class="fas fa-paper-plane me-2"></i>Send OTP
                    </button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small">Don't have an account? <a href="signup.html"
                            class="text-danger text-decoration-none fw-bold">Create Account</a></p>
                </div>
            </div>

            <!-- Step 2: OTP Verification -->
            <div id="step2" class="step">
                <p class="text-center mb-3">Enter OTP sent to <strong id="otpEmailDisplay"></strong></p>
                <div class="otp-group">
                    <input type="text" id="otpCode" placeholder="6-digit OTP" maxlength="6" autocomplete="off">
                    <button type="button" class="btn-otp" id="resendOtpBtn" onclick="resendOTP()">Resend</button>
                </div>
                <button class="btn-login mt-2" onclick="verifyOTP()">
                    <i class="fas fa-check-circle me-2"></i>Verify & Login
                </button>
                <div class="resend-text">
                    <a onclick="backToEmail()">← Use different email</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        let generatedOTP = null;
        let otpEmail = null;
        let otpTimer = null;
        let timeLeft = 60;

        // Initialize EmailJS
        emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);

        function sendOTP(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                showError('Please enter your email address');
                return;
            }

            const users = getUsers();
            const userExists = users.some(u => u.email === email);

            if (!userExists) {
                showError('No account found with this email. Please sign up first.');
                return;
            }

            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            otpEmail = email;

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending OTP...';

            const templateParams = {
                to_email: email,
                otp: generatedOTP,
                from_name: 'Dakshin Travel',
                reply_to: 'support@dakshin.com'
            };

            emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.LOGIN_TEMPLATE_ID, templateParams)
                .then(function (response) {
                    console.log('OTP sent:', response);
                    showSuccess(`OTP sent to ${email}`);
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('otpEmailDisplay').textContent = email;
                    startTimer();
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send OTP';
                })
                .catch(function (error) {
                    console.error('EmailJS Error:', error);
                    showError('Failed to send OTP. Please try again.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send OTP';

                    // DEMO MODE FALLBACK
                    if (CONFIG.IS_DEMO_MODE) {
                        alert(`[DEMO MODE] OTP for ${email} is: ${generatedOTP}`);
                        document.getElementById('step1').classList.remove('active');
                        document.getElementById('step2').classList.add('active');
                        document.getElementById('otpEmailDisplay').textContent = email;
                        startTimer();
                    }
                });
        }

        function startTimer() {
            timeLeft = 60;
            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.disabled = true;

            if (otpTimer) clearInterval(otpTimer);

            otpTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(otpTimer);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend';
                } else {
                    resendBtn.innerHTML = `Resend (${timeLeft}s)`;
                }
            }, 1000);
        }

        function resendOTP() {
            if (!otpEmail) return;

            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

            const templateParams = {
                to_email: otpEmail,
                otp: generatedOTP,
                from_name: 'Dakshin Travel'
            };

            const btn = document.getElementById('resendOtpBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.LOGIN_TEMPLATE_ID, templateParams)
                .then(function () {
                    showSuccess(`New OTP sent to ${otpEmail}`);
                    clearInterval(otpTimer);
                    startTimer();
                })
                .catch(function () {
                    if (CONFIG.IS_DEMO_MODE) {
                        alert(`[DEMO MODE] New OTP: ${generatedOTP}`);
                        clearInterval(otpTimer);
                        startTimer();
                    } else {
                        showError('Failed to resend OTP. Please try again.');
                        btn.innerHTML = 'Resend';
                    }
                });
        }

        function verifyOTP() {
            const enteredOTP = document.getElementById('otpCode').value;

            if (!enteredOTP) {
                showError('Please enter the OTP');
                return;
            }

            if (enteredOTP === generatedOTP) {
                const users = getUsers();
                const user = users.find(u => u.email === otpEmail);

                if (user) {
                    const { password, ...safeUser } = user;
                    localStorage.setItem('dakshin_current_user', JSON.stringify(safeUser));

                    showSuccess('Login successful! Redirecting...');
                    clearInterval(otpTimer);

                    setTimeout(() => {
                        const redirectUrl = sessionStorage.getItem('redirectAfterLogin');
                        if (redirectUrl) {
                            sessionStorage.removeItem('redirectAfterLogin');
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                } else {
                    showError('User not found');
                }
            } else {
                showError('Invalid OTP. Please try again.');
            }
        }

        function backToEmail() {
            clearInterval(otpTimer);
            generatedOTP = null;
            otpEmail = null;
            document.getElementById('otpCode').value = '';
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('sendOtpBtn').disabled = false;
            document.getElementById('sendOtpBtn').innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send OTP';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            if (successDiv) successDiv.style.display = 'none';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const errorDiv = document.getElementById('errorMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            if (errorDiv) errorDiv.style.display = 'none';
            setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (redirectUrl) sessionStorage.setItem('redirectAfterLogin', redirectUrl);
    </script>
</body>

</html>
