<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fef9f5;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 2000;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-link {
            color: #e2e8f0 !important;
            font-weight: 600;
            border-radius: 40px;
            padding: 0.5rem 1rem !important;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(212, 30, 60, 0.15);
            color: #ffb347 !important;
        }

        .page-header {
            padding-top: 100px;
            padding-bottom: 40px;
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            color: white;
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 800;
        }

        .card {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            margin-bottom: 30px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .card-img-top {
            height: 220px;
            object-fit: cover;
        }

        .modal-content {
            border-radius: 28px;
            border: none;
        }

        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }

        .info-badge {
            display: inline-block;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 3px;
        }

        .nearby-place {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 10px;
        }

        .search-bar {
            max-width: 800px;
            margin: 30px auto;
            display: flex;
            gap: 15px;
        }

        .search-bar input,
        .search-bar select {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 50px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d41e3c, #ff6b35);
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 700;
        }

        footer {
            background: #0f1a24;
            color: #94a3b8;
            text-align: center;
            padding: 2.5rem;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }

            .search-bar {
                flex-direction: column;
                margin: 20px;
            }

            .carousel-item img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">✨ Dakshin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon bg-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="tourpackages.html">Tour Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="openTripPlanner()">Trip Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="faqs.html">FAQs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>✨ Explore 30+ Destinations</h1>
            <p class="lead">Discover the best places to visit across South India</p>
        </div>
    </section>

    <section class="py-4">
        <div class="container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search destinations...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="beach">🏖️ Beaches</option>
                    <option value="hill">⛰️ Hill Stations</option>
                    <option value="temple">🛕 Temples</option>
                    <option value="wildlife">🐘 Wildlife</option>
                </select>
                <button class="btn btn-primary" onclick="filterDestinations()">Search</button>
            </div>
            <div class="row" id="destinationsGrid"></div>
        </div>
    </section>

    <footer>
        <p>© 2026 Dakshin | South India's Ultimate Travel Guide</p>
    </footer>

    <div class="modal fade" id="destinationModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="bookFromModalBtn" onclick="bookFromModal()">Book
                        This Package</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/trip-planner.js"></script>
    <script>
        function openTripPlanner() { const modal = new bootstrap.Modal(document.getElementById('tripPlannerModal')); if (typeof loadPlannerForm === 'function') loadPlannerForm(); modal.show(); }
        window.openTripPlanner = openTripPlanner;
    </script>
</body>

</html>
