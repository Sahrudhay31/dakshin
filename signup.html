<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .signup-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-signup {
            background: linear-gradient(135deg, #d41e3c, #ff6b35);
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            color: white;
        }

        .btn-signup:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
        }

        .input-group-custom input:focus {
            outline: none;
            border-color: #d41e3c;
            box-shadow: 0 0 0 3px rgba(212, 30, 60, 0.1);
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .otp-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .otp-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 5px;
        }

        .btn-otp {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 0 20px;
            font-weight: 600;
            color: #d41e3c;
            white-space: nowrap;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.7rem;
        }

        .strength-weak {
            color: #dc2626;
        }

        .strength-medium {
            color: #f59e0b;
        }

        .strength-strong {
            color: #10b981;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .signup-card {
                padding: 30px 25px;
                margin: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div class="logo">✨ Dakshin</div>
        <h3 class="text-center mb-2">Create an Account</h3>
        <p class="text-center text-muted mb-4">Join us with email verification</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div id="step1" class="step active">
            <form id="signupForm" onsubmit="sendSignupOTP(event)">
                <div class="form-row">
                    <div class="input-group-custom"><i class="fas fa-user"></i><input type="text" id="fullName"
                            placeholder="Full Name *" required></div>
                    <div class="input-group-custom"><i class="fas fa-at"></i><input type="text" id="username"
                            placeholder="Username *" required></div>
                </div>
                <div class="form-row">
                    <div class="input-group-custom"><i class="fas fa-envelope"></i><input type="email" id="email"
                            placeholder="Email Address *" required></div>
                    <div class="input-group-custom"><i class="fas fa-calendar-alt"></i><input type="date" id="dob">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group-custom"><i class="fas fa-lock"></i><input type="password" id="password"
                            placeholder="Password *" required onkeyup="checkPasswordStrength()"></div>
                    <div class="input-group-custom"><i class="fas fa-check-circle"></i><input type="password"
                            id="confirmPassword" placeholder="Confirm Password *" required></div>
                </div>
                <div id="passwordStrength" class="password-strength"></div>
                <div class="d-flex align-items-center gap-2 mb-4 mt-3">
                    <input type="checkbox" id="termsCheckbox" required> <label class="small">I agree to the <a href="#"
                            class="text-danger" onclick="showTerms(event)">Terms of Service</a></label>
                </div>
                <button type="submit" class="btn-signup" id="signupBtn"><i class="fas fa-user-plus me-2"></i>Sign Up &
                    Verify Email</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                <p class="small">Already have an account? <a href="login.html"
                        class="text-danger text-decoration-none fw-bold">Log In</a></p>
            </div>
        </div>

        <div id="step2" class="step">
            <p class="text-center mb-3">Enter OTP sent to <strong id="otpEmailDisplay"></strong></p>
            <div class="otp-group">
                <input type="text" id="otpCode" placeholder="6-digit OTP" maxlength="6" autocomplete="off">
                <button type="button" class="btn-otp" id="resendOtpBtn" onclick="resendSignupOTP()">Resend</button>
            </div>
            <button class="btn-signup mt-2" onclick="verifySignupOTP()">
                <i class="fas fa-check-circle me-2"></i>Verify & Complete Signup
            </button>
            <div class="text-center mt-3">
                <a onclick="backToSignup()" style="cursor: pointer; color: #d41e3c;">← Edit information</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        let signupOTP = null;
        let signupEmail = null;
        let pendingUserData = null;
        let otpTimer = null;
        let timeLeft = 60;

        emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);

        function sendSignupOTP(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const dob = document.getElementById('dob').value;
            const termsChecked = document.getElementById('termsCheckbox').checked;

            if (!fullName || !username || !email || !password) {
                showError('Please fill in all required fields');
                return;
            }
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            if (!termsChecked) {
                showError('Please agree to the Terms of Service');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            const users = getUsers();
            if (users.some(u => u.username === username)) {
                showError('Username already taken');
                return;
            }
            if (users.some(u => u.email === email)) {
                showError('Email already registered');
                return;
            }

            pendingUserData = { fullName, username, email, password, dob };
            signupEmail = email;
            signupOTP = Math.floor(100000 + Math.random() * 900000).toString();

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending Verification...';

            const templateParams = {
                to_email: email,
                otp: signupOTP,
                name: fullName,
                from_name: 'Dakshin Travel'
            };

            emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.SIGNUP_TEMPLATE_ID, templateParams)
                .then(function (response) {
                    showSuccess(`Verification OTP sent to ${email}`);
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('otpEmailDisplay').textContent = email;
                    startSignupTimer();
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Sign Up & Verify Email';
                })
                .catch(function (error) {
                    console.error('EmailJS Error:', error);
                    showError('Failed to send verification. Please try again.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Sign Up & Verify Email';
                });
        }

        function startSignupTimer() {
            timeLeft = 60;
            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.disabled = true;

            if (otpTimer) clearInterval(otpTimer);

            otpTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(otpTimer);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend';
                } else {
                    resendBtn.innerHTML = `Resend (${timeLeft}s)`;
                }
            }, 1000);
        }

        function resendSignupOTP() {
            if (!signupEmail) return;

            signupOTP = Math.floor(100000 + Math.random() * 900000).toString();

            const templateParams = {
                to_email: signupEmail,
                otp: signupOTP,
                name: pendingUserData?.fullName || 'User',
                from_name: 'Dakshin Travel'
            };

            const btn = document.getElementById('resendOtpBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.SIGNUP_TEMPLATE_ID, templateParams)
                .then(function () {
                    showSuccess(`New OTP sent to ${signupEmail}`);
                    clearInterval(otpTimer);
                    startSignupTimer();
                })
                .catch(function () {
                    showError('Failed to resend OTP. Please try again.');
                    btn.innerHTML = 'Resend';
                });
        }

        function verifySignupOTP() {
            const enteredOTP = document.getElementById('otpCode').value;

            if (!enteredOTP) {
                showError('Please enter the OTP');
                return;
            }

            if (enteredOTP === signupOTP) {
                const result = registerUser(
                    pendingUserData.fullName,
                    pendingUserData.username,
                    pendingUserData.email,
                    pendingUserData.password,
                    pendingUserData.dob
                );

                if (result.success) {
                    showSuccess('Email verified! Account created successfully. Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showError(result.message);
                }
            } else {
                showError('Invalid OTP. Please try again.');
            }
        }

        function backToSignup() {
            clearInterval(otpTimer);
            signupOTP = null;
            signupEmail = null;
            pendingUserData = null;
            document.getElementById('otpCode').value = '';
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }

        function checkPasswordStrength() {
            const pwd = document.getElementById('password').value;
            const div = document.getElementById('passwordStrength');
            if (!pwd.length) { div.innerHTML = ''; return; }
            let s = 0;
            if (pwd.length >= 8) s++;
            if (pwd.match(/[a-z]/)) s++;
            if (pwd.match(/[A-Z]/)) s++;
            if (pwd.match(/[0-9]/)) s++;
            if (pwd.match(/[^a-zA-Z0-9]/)) s++;
            if (s <= 2) { div.innerHTML = '🔴 Weak password'; div.className = 'password-strength strength-weak'; }
            else if (s <= 4) { div.innerHTML = '🟡 Medium password'; div.className = 'password-strength strength-medium'; }
            else { div.innerHTML = '🟢 Strong password'; div.className = 'password-strength strength-strong'; }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            if (successDiv) successDiv.style.display = 'none';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const errorDiv = document.getElementById('errorMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            if (errorDiv) errorDiv.style.display = 'none';
            setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
        }

        function showTerms(e) { e.preventDefault(); alert("📜 Terms of Service:\n\n1. All bookings subject to availability.\n2. Email verification required.\n3. OTP valid for 60 seconds.\n4. Valid ID required at check-in."); }
    </script>
</body>

</html>
