<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .signup-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #ff6b35);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-signup {
            background: linear-gradient(135deg, #d41e3c, #ff6b35);
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            color: white;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group-custom input:focus {
            outline: none;
            border-color: #d41e3c;
            box-shadow: 0 0 0 3px rgba(212, 30, 60, 0.1);
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.7rem;
        }

        .strength-weak {
            color: #dc2626;
        }

        .strength-medium {
            color: #f59e0b;
        }

        .strength-strong {
            color: #10b981;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .signup-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div class="logo">✨ Dakshin</div>
        <h3 class="text-center mb-2">Create an Account</h3>
        <p class="text-center text-muted mb-4">Join us to start your South India adventure</p>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-user"></i><input type="text" id="fullName"
                        placeholder="Full Name *" required></div>
                <div class="input-group-custom"><i class="fas fa-at"></i><input type="text" id="username"
                        placeholder="Username *" required></div>
            </div>
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-envelope"></i><input type="email" id="email"
                        placeholder="Email Address *" required></div>
                <div class="input-group-custom"><i class="fas fa-calendar-alt"></i><input type="date" id="dob"
                        placeholder="Date of Birth"></div>
            </div>
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-lock"></i><input type="password" id="password"
                        placeholder="Password *" required onkeyup="checkPasswordStrength()"></div>
                <div class="input-group-custom"><i class="fas fa-check-circle"></i><input type="password"
                        id="confirmPassword" placeholder="Confirm Password *" required></div>
            </div>
            <div id="passwordStrength" class="password-strength"></div>
            <div class="d-flex align-items-center gap-2 mb-4 mt-3">
                <input type="checkbox" id="termsCheckbox" required> <label class="small">I agree to the <a href="#"
                        class="text-danger" onclick="showTerms(event)">Terms of Service</a> and <a href="#"
                        class="text-danger" onclick="showPrivacy(event)">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn-signup"><i class="fas fa-user-plus me-2"></i>Sign Up</button>
        </form>
        <div class="text-center mt-4 pt-3 border-top">
            <p class="small">Already have an account? <a href="login.html"
                    class="text-danger text-decoration-none fw-bold">Log In</a></p>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script>
        function checkPasswordStrength() { const pwd = document.getElementById('password').value; const div = document.getElementById('passwordStrength'); if (!pwd.length) { div.innerHTML = ''; return; } let s = 0; if (pwd.length >= 8) s++; if (pwd.match(/[a-z]/)) s++; if (pwd.match(/[A-Z]/)) s++; if (pwd.match(/[0-9]/)) s++; if (pwd.match(/[^a-zA-Z0-9]/)) s++; if (s <= 2) { div.innerHTML = '🔴 Weak password'; div.className = 'password-strength strength-weak'; } else if (s <= 4) { div.innerHTML = '🟡 Medium password'; div.className = 'password-strength strength-medium'; } else { div.innerHTML = '🟢 Strong password'; div.className = 'password-strength strength-strong'; } }
        function showTerms(e) { e.preventDefault(); alert("📜 Terms of Service:\n\n1. All bookings are subject to availability.\n2. Cancellation policy applies as per package.\n3. Prices may vary based on season.\n4. Valid ID proof required at check-in."); }
        function showPrivacy(e) { e.preventDefault(); alert("🔒 Privacy Policy:\n\nWe value your privacy. Your personal data is secure and never shared with third parties without consent."); }
    </script>
</body>

</html>
