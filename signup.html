<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dakshin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">✨ Dakshin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon bg-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="tourpackages.html">Tour Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="faqs.html">FAQs</a></li>
                    <li class="nav-item" id="authNavItem"><a class="nav-link" id="authLink" href="login.html">Sign
                            In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-card" style="max-width: 550px;">
        <div class="logo">✨ Dakshin</div>
        <h3 class="text-center mb-2">Create an Account</h3>
        <p class="text-center text-muted mb-4">Join us to start your South India adventure</p>

        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <form id="signupForm">
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-user"></i><input type="text" id="fullName"
                        placeholder="Full Name *" required></div>
                <div class="input-group-custom"><i class="fas fa-at"></i><input type="text" id="username"
                        placeholder="Username *" required></div>
            </div>
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-envelope"></i><input type="email" id="email"
                        placeholder="Email Address *" required></div>
                <div class="input-group-custom"><i class="fas fa-calendar-alt"></i><input type="date" id="dob"></div>
            </div>
            <div class="form-row">
                <div class="input-group-custom"><i class="fas fa-lock"></i><input type="password" id="password"
                        placeholder="Password *" required></div>
                <div class="input-group-custom"><i class="fas fa-check-circle"></i><input type="password"
                        id="confirmPassword" placeholder="Confirm Password *" required></div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-4 mt-3">
                <input type="checkbox" id="termsCheckbox" required> <label class="small">I agree to the <a href="#"
                        class="text-danger" onclick="alert('Terms of Service')">Terms of Service</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus me-2"></i>Sign Up</button>
        </form>
        <div class="text-center mt-4 pt-3 border-top">
            <p class="small">Already have an account? <a href="login.html"
                    class="text-danger text-decoration-none fw-bold">Log In</a></p>
        </div>
    </div>

    <footer>
        <p>© 2026 Dakshin | South India's Ultimate Travel Guide</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            if (password !== confirm) { errorDiv.textContent = 'Passwords do not match'; errorDiv.classList.remove('d-none'); setTimeout(() => errorDiv.classList.add('d-none'), 3000); return; }
            if (password.length < 6) { errorDiv.textContent = 'Password must be at least 6 characters'; errorDiv.classList.remove('d-none'); setTimeout(() => errorDiv.classList.add('d-none'), 3000); return; }

            const result = registerUser(fullName, username, email, password, '');
            if (result.success) { window.location.href = 'index.html'; }
            else { errorDiv.textContent = result.message; errorDiv.classList.remove('d-none'); setTimeout(() => errorDiv.classList.add('d-none'), 3000); }
        });
    </script>
</body>

</html>
